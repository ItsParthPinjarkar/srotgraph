<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a2e"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        fill: url(#textGrad);
        filter: url(#glow);
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -20; }
      }
      .bg-line { animation: dash 1s linear infinite; }
      .node-pulse { animation: pulse 2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g stroke="#4f46e5" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
  </g>

  <!-- Animated connection lines -->
  <g stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.5">
    <path class="bg-line" d="M 80,100 L 250,100 L 400,60 L 550,100 L 720,100" stroke-dasharray="8,4"/>
    <path class="bg-line" d="M 80,140 L 250,140 L 400,160 L 550,140 L 720,140" stroke-dasharray="8,4" style="animation-delay: 0.5s"/>
  </g>

  <!-- Network nodes -->
  <g fill="#c084fc">
    <circle cx="80" cy="100" r="6" class="node-pulse"/>
    <circle cx="250" cy="100" r="8" class="node-pulse" style="animation-delay: 0.3s"/>
    <circle cx="400" cy="60" r="10" class="node-pulse" style="animation-delay: 0.6s"/>
    <circle cx="550" cy="100" r="8" class="node-pulse" style="animation-delay: 0.9s"/>
    <circle cx="720" cy="100" r="6" class="node-pulse" style="animation-delay: 1.2s"/>
  </g>
  <g fill="#f472b6">
    <circle cx="80" cy="140" r="6" class="node-pulse" style="animation-delay: 0.2s"/>
    <circle cx="250" cy="140" r="8" class="node-pulse" style="animation-delay: 0.5s"/>
    <circle cx="400" cy="160" r="10" class="node-pulse" style="animation-delay: 0.8s"/>
    <circle cx="550" cy="140" r="8" class="node-pulse" style="animation-delay: 1.1s"/>
    <circle cx="720" cy="140" r="6" class="node-pulse" style="animation-delay: 1.4s"/>
  </g>

  <!-- SrotGraph text -->
  <text x="400" y="108" text-anchor="middle" font-size="56" letter-spacing="4">
    SrotGraph
  </text>

  <!-- Subtitle -->
  <text x="400" y="150" text-anchor="middle" font-size="14" fill="#a5b4fc" letter-spacing="6" font-weight="300">
    EVIDENCE · PRESERVING · INTELLIGENCE
  </text>

  <!-- Decorative corner accents -->
  <g stroke="#818cf8" stroke-width="2" opacity="0.6">
    <polyline points="20,20 20,50 50,50" fill="none"/>
    <polyline points="780,20 780,50 750,50" fill="none"/>
    <polyline points="20,180 20,150 50,150" fill="none"/>
    <polyline points="780,180 780,150 750,150" fill="none"/>
  </g>
</svg>
