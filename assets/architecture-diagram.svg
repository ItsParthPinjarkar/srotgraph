<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a2e"/>
      <stop offset="100%" style="stop-color:#1a123a"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#172554"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: url(#glow); opacity: 0.8; }
        50% { filter: url(#glow); opacity: 1; }
      }
      .title { animation: fadeSlideUp 0.8s ease-out forwards; }
      .subtitle { animation: fadeSlideUp 0.8s ease-out 0.2s forwards; opacity: 0; }
      .layer-label { animation: fadeSlideUp 0.6s ease-out 0.4s forwards; opacity: 0; }
      .box { animation: fadeSlideUp 0.5s ease-out 0.6s forwards; opacity: 0; }
      .box:nth-child(12) { animation-delay: 0.7s; }
      .box:nth-child(13) { animation-delay: 0.8s; }
      .box:nth-child(14) { animation-delay: 0.9s; }
      .box:nth-child(15) { animation-delay: 1.0s; }
      .box:nth-child(16) { animation-delay: 1.1s; }
      .arrow { animation: fadeSlideUp 0.5s ease-out 1.2s forwards; opacity: 0; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" class="title" font-size="28" font-weight="700" fill="#e0e7ff" letter-spacing="2">
    SrotGraph System Architecture
  </text>
  <text x="450" y="62" text-anchor="middle" class="subtitle" font-size="13" fill="#818cf8" letter-spacing="3">
    EVIDENCE — PRESERVING — INTELLIGENCE
  </text>

  <!-- Horizontal divider -->
  <line x1="100" y1="75" x2="800" y2="75" stroke="#4f46e5" stroke-width="1" opacity="0.3"/>

  <!-- LAYER LABELS -->
  <g font-size="11" fill="#a5b4fc" font-weight="600" letter-spacing="2" text-transform="uppercase">
    <text x="80" y="100" class="layer-label">User Layer</text>
    <text x="350" y="100" class="layer-label">API Layer</text>
    <text x="580" y="100" class="layer-label">AI Layer</text>
    <text x="750" y="100" class="layer-label">Data Layer</text>
  </g>

  <!-- ===== USER LAYER ===== -->
  <g>
    <!-- Web UI Box -->
    <rect x="40" y="120" width="160" height="100" rx="8" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#818cf8" stroke-width="1"/>
    <text x="120" y="152" text-anchor="middle" class="box" font-size="14" font-weight="600" fill="#e0e7ff">Web UI</text>
    <text x="120" y="170" text-anchor="middle" class="box" font-size="11" fill="#a5b4fc">Next.js 15</text>
    <text x="120" y="186" text-anchor="middle" class="box" font-size="11" fill="#a5b4fc">TypeScript</text>
    <text x="120" y="200" text-anchor="middle" class="box" font-size="11" fill="#a5b4fc">Tailwind CSS</Text>

    <!-- API Client Box -->
    <rect x="230" y="120" width="160" height="100" rx="8" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#818cf8" stroke-width="1"/>
    <text x="310" y="152" text-anchor="middle" class="box" font-size="14" font-weight="600" fill="#e0e7ff">API Client</text>
    <text x="310" y="170" text-anchor="middle" class="box" font-size="11" fill="#a5b4fc">(Future)</text>
    <text x="310" y="186" text-anchor="middle" class="box" font-size="11" fill="#a5b4fc">Programmatic</Text>
    <text x="310" y="200" text-anchor="middle" class="box" font-size="11" fill="#a5b4fc">Access</Text>

    <!-- Arrows down from user layer -->
    <g stroke="#818cf8" stroke-width="2" marker-end="url(#arrowHead)" class="arrow">
      <line x1="120" y1="220" x2="120" y2="260"/>
      <line x1="310" y1="220" x2="310" y2="260"/>
    </g>
  </g>

  <!-- ===== API LAYER ===== -->
  <g>
    <!-- FastAPI Box (large) -->
    <rect x="240" y="280" width="220" height="140" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#38bdf8" stroke-width="2"/>
    <text x="350" y="312" text-anchor="middle" class="box" font-size="15" font-weight="700" fill="#7dd3fc">FastAPI Application</text>
    <text x="350" y="335" text-anchor="middle" class="box" font-size="11" fill="#93c5fd">Routes · Services · Models</Text>
    <text x="350" y="352" text-anchor="middle" class="box" font-size="11" fill="#93c5fd">Providers · Workers</Text>
    <text x="350" y="369" text-anchor="middle" class="box" font-size="11" fill="#93c5fd">Storage · Config</Text>
    <text x="350" y="386" text-anchor="middle" class="box" font-size="11" fill="#93c5fd">Python 3.12</Text>

    <!-- Side boxes -->
    <rect x="490" y="280" width="120" height="60" rx="8" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#818cf8" stroke-width="1"/>
    <text x="550" y="305" text-anchor="middle" class="box" font-size="12" font-weight="600" fill="#e0e7ff">SQLAlchemy</Text>
    <text x="550" y="322" text-anchor="middle" class="box" font-size="11" fill="#a5b4fc">ORM · asyncpg</Text>

    <rect x="490" y="355" width="120" height="60" rx="8" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#818cf8" stroke-width="1"/>
    <text x="550" y="380" text-anchor="middle" class="box" font-size="12" font-weight="600" fill="#e0e7ff">Pytest</Text>
    <text x="550" y="397" text-anchor="middle" class="box" font-size="11" fill="#a5b4fc">Unit · Contract</Text>

    <!-- Arrow from API to AI -->
    <g stroke="#c084fc" stroke-width="2" class="arrow">
      <line x1="460" y1="350" x2="560" y2="350"/>
    </g>

    <!-- Arrow from API to DB -->
    <g stroke="#38bdf8" stroke-width="2" class="arrow">
      <line x1="350" y1="420" x2="350" y2="460"/>
      <line x1="350" y1="460" x2="580" y2="460"/>
    </g>
  </g>

  <!-- ===== AI LAYER ===== -->
  <g>
    <rect x="570" y="260" width="280" height="180" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#c084fc" stroke-width="2"/>
    <text x="710" y="292" text-anchor="middle" class="box" font-size="14" font-weight="700" fill="#d8b4fe">AI Provider Interface</Text>
    <text x="710" y="314" text-anchor="middle" class="box" font-size="11" fill="#e9d5ff">Pluggable · Interchangeable</Text>

    <!-- Provider cards -->
    <rect x="590" y="328" width="110" height="50" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="645" y="348" text-anchor="middle" class="box" font-size="11" font-weight="600" fill="#a5b4fc">Mock</Text>
    <text x="645" y="364" text-anchor="middle" class="box" font-size="10" fill="#818cf8">(Default)</Text>

    <rect x="710" y="328" width="110" height="50" rx="6" fill="#1e1b4b" stroke="#c084fc" stroke-width="1"/>
    <text x="765" y="343" text-anchor="middle" class="box" font-size="11" font-weight="600" fill="#d8b4fe">Whisper</Text>
    <text x="765" y="358" text-anchor="middle" class="box" font-size="10" fill="#e9d5ff">OpenAI</Text>

    <rect x="590" y="388" width="110" height="40" rx="6" fill="#1e1b4b" stroke="#f472b6" stroke-width="1"/>
    <text x="645" y="405" text-anchor="middle" class="box" font-size="11" font-weight="600" fill="#f9a8d4">OpenAI</Text>
    <text x="645" y="419" text-anchor="middle" class="box" font-size="10" fill="#f9a8d4">GPT-4</Text>

    <rect x="710" y="388" width="110" height="40" rx="6" fill="#1e1b4b" stroke="#34d399" stroke-width="1"/>
    <text x="765" y="405" text-anchor="middle" class="box" font-size="11" font-weight="600" fill="#6ee7b7">DeepGram</Text>
    <text x="765" y="419" text-anchor="middle" class="box" font-size="10" fill="#6ee7b7">Cloud</Text>

    <!-- Arrow from AI back to API -->
    <g stroke="#c084fc" stroke-width="2" class="arrow">
      <line x1="570" y1="350" x2="460" y2="350" stroke-dasharray="5,3"/>
    </g>
  </g>

  <!-- ===== DATA LAYER ===== -->
  <g>
    <!-- PostgreSQL -->
    <rect x="580" y="470" width="140" height="40" rx="8" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#38bdf8" stroke-width="2"/>
    <text x="650" y="494" text-anchor="middle" class="box" font-size="13" font-weight="700" fill="#7dd3fc">PostgreSQL</Text>

    <!-- Redis -->
    <rect x="740" y="470" width="100" height="40" rx="8" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#f472b6" stroke-width="2"/>
    <text x="790" y="494" text-anchor="middle" class="box" font-size="13" font-weight="700" fill="#f9a8d4">Redis</Text>
    <text x="790" y="482" text-anchor="middle" class="box" font-size="9" fill="#f9a8d4">Streams</Text>

    <!-- Object Storage -->
    <rect x="580" y="515" width="140" height="0" rx="8" fill="url(#boxGrad1)" stroke="#818cf8" stroke-width="1"/>

    <!-- Arrow from API to Data -->
    <g stroke="#38bdf8" stroke-width="2" class="arrow">
      <line x1="550" y1="460" x2="580" y2="490"/>
    </g>

    <!-- Object storage label -->
    <text x="750" y="525" text-anchor="middle" class="box" font-size="11" fill="#a5b4fc">Local FS / S3</Text>
  </g>

  <!-- Decorative corner elements -->
  <g stroke="#818cf8" stroke-width="2" opacity="0.4">
    <polyline points="20,20 20,60 60,60" fill="none"/>
    <polyline points="880,20 880,60 840,60" fill="none"/>
    <polyline points="20,500 20,460 60,460" fill="none"/>
    <polyline points="880,500 880,460 840,460" fill="none"/>
  </g>

  <!-- Bottom tagline -->
  <text x="450" y="545" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="2">
    modular monolith · pluggable ai · evidence preserved
  </text>
</svg>
